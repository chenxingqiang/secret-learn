name: Feature Request
description: Suggest a new feature
labels: ['enhancement']

body:
- type: textarea
  attributes:
    label: Feature Description
    description: What feature would you like to see?
  validations:
    required: true

- type: dropdown
  attributes:
    label: Privacy Mode
    description: Which mode should this feature support?
    multiple: true
    options:
      - FL (Federated Learning)
      - SS (Secret Sharing)
      - SL (Split Learning)
      - All modes
  validations:
    required: true

- type: textarea
  attributes:
    label: Use Case
    description: Describe your use case for this feature.
  validations:
    required: true

- type: textarea
  attributes:
    label: Proposed Solution
    description: How would you implement this? (optional)
