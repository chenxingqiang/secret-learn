name: Bug Report
description: Report a bug in Secret-Learn
labels: ['bug', 'triage']

body:
- type: markdown
  attributes:
    value: |
      Before submitting, please search [existing issues](https://github.com/chenxingqiang/secret-learn/issues).

- type: dropdown
  attributes:
    label: Privacy Mode
    description: Which mode are you using?
    options:
      - FL (Federated Learning)
      - SS (Secret Sharing)
      - SL (Split Learning)
      - Not applicable
  validations:
    required: true

- type: textarea
  attributes:
    label: Describe the bug
    description: A clear description of the bug.
  validations:
    required: true

- type: textarea
  attributes:
    label: Code to Reproduce
    description: |
      Minimal code example to reproduce the issue:
      ```python
      import secretflow as sf
      from secretlearn.federated_learning.clustering.kmeans import FLKMeans
      
      sf.init(['alice', 'bob'])
      # Your code here
      ```
    render: python
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected vs Actual
    description: What did you expect vs what actually happened?
  validations:
    required: true

- type: textarea
  attributes:
    label: Environment
    description: |
      ```
      Python version:
      SecretFlow version:
      Secret-Learn version:
      OS:
      ```
    render: shell
  validations:
    required: true
